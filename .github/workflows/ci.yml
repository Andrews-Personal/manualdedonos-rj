name: CI

# Roda em todo PR e em todo push para main. É o mesmo conjunto de verificações
# que o deploy executa antes de publicar — se falhar aqui, falha lá.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Lint e build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Instalar dependências das Cloud Functions
        run: pnpm --prefix functions install --frozen-lockfile

      - name: Lint
        run: pnpm run lint:ci

      - name: Compilar as Cloud Functions
        run: pnpm run func:build

      # O build do frontend exige as VITE_* (env.ts valida no boot, mas o
      # bundle precisa dos valores na compilação). Em PR usamos placeholders:
      # o objetivo aqui é provar que o TypeScript e o Vite passam, não publicar.
      - name: Build do frontend
        env:
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-project
          VITE_FIREBASE_STORAGE_BUCKET: ci.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          VITE_FIREBASE_APP_ID: '1:000000000000:web:ci'
          VITE_ENVIRONMENT: development
          VITE_APP_URL: http://localhost:5173
          VITE_FUNCTIONS_REGION: southamerica-east1
        run: pnpm run build
