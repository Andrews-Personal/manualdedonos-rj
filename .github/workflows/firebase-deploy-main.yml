name: Deploy para o Firebase (main)

# Deploy automático: todo push aceito em `main` publica em produção.
# Nenhum outro branch dispara este workflow.
on:
  push:
    branches: [main]

# Uma publicação por vez. Dois merges seguidos em main disparariam dois
# deploys simultâneos, e o que terminasse por último venceria — que não é
# necessariamente o commit mais novo.
concurrency:
  group: firebase-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build e deploy
    runs-on: ubuntu-latest

    # `environment` permite exigir aprovação manual antes do deploy
    # (Settings → Environments → production → Required reviewers).
    environment:
      name: production
      url: https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app

    permissions:
      contents: read
      # Necessária para a autenticação via Workload Identity Federation.
      # Inofensiva quando se usa a service account em JSON.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Instalar dependências das Cloud Functions
        run: pnpm --prefix functions install --frozen-lockfile

      - name: Lint
        run: pnpm run lint:ci

      # As VITE_* são compiladas DENTRO do bundle. Precisam existir aqui, no
      # passo de build — defini-las só no passo de deploy não tem efeito
      # nenhum, porque a essa altura o JS já foi gerado.
      - name: Build do frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_ENVIRONMENT: production
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_FUNCTIONS_REGION: ${{ vars.FUNCTIONS_REGION || 'southamerica-east1' }}
          VITE_USE_EMULATORS: 'false'
        run: pnpm run build

      - name: Compilar as Cloud Functions
        run: pnpm run func:build

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # O firebase-tools lê a credencial exportada pelo passo acima
      # (GOOGLE_APPLICATION_CREDENTIALS), então não é preciso passar token.
      - name: Deploy (hosting, regras, índices e functions)
        run: |
          pnpm dlx firebase-tools@latest deploy \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}" \
            --only hosting,firestore:rules,firestore:indexes,storage,functions \
            --non-interactive \
            --force
